[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "netdiag-rag"
version = "0.1.0"
description = "Evidence-grounded network diagnosis with reproducible retrieval"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "PyYAML>=6,<7", "numpy>=1.26,<3",
  "bm25s>=0.2,<0.3", "jieba>=0.42,<0.43", "faiss-cpu>=1.9,<2",
]

[project.optional-dependencies]
models = ["transformers>=4.46,<5", "torch>=2.5,<3", "sentencepiece>=0.2,<0.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
netdiag-rag = "netdiag_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netdiag_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
